
<!-- div.nav-menu>nav#top-nav-bar.top-nav-bar>ul.navbar-left>li*4.nav-items>button.nav-btn> -->
<header class="header">
  
  <div class="nav-menu">
    <nav id="top-nav-bar" class="top-nav-bar">

      <!-- Top Hader Left -->
      <ul class="top-navbar-left">
        <li class="nav-items">
          <img src="../assets/logo.svg" alt="Logo">
        </li>
        <li class="nav-items"><button *ngIf="isShowCatalog" class="nav-btn top-nav-btn">{{topHeaderBarItem1}}</button></li>
        <li class="nav-items"><button *ngIf="isShowCatalog" class="nav-btn top-nav-btn">{{aboutCompany}}</button></li>
        <li class="nav-items"><button *ngIf="isShowCatalog" class="nav-btn top-nav-btn">{{catalog}}</button></li>
        <button (click)="isShowCatalog = !isShowCatalog" style="border: 2px solid silver;">
          {{text}}
        </button>
        <button (click)="changeMenuText()" style="border: 2px solid silver;">
          Изменить текст
        </button>  
      </ul>
    
    <!-- Top Hader Right -->
      <ul class="top-navbar-right">
        <li class="nav-items">
          <button class="nav-btn top-nav-btn" href="tel:+7 (965) 084-29-29">
            <img src="../assets/phone.svg" class="phon-icon" alt="Call">
            <span>{{phoneNumber}}</span>
          </button>
        </li>
        <li class="nav-items">
          <button class="nav-btn top-nav-btn favorite-icon">
            <img src="../assets/favorite.svg" alt="Favorite">
          </button>
        </li>
        <li class="nav-items">
          <button class="nav-btn top-nav-btn order-card">
            <img src="../assets/card.svg" alt="Card" >
            <span>{{orderBtn}}</span>
          </button>
        </li>
      </ul>
    </nav>

    <nav id="bottom-nav-bar" class="bottom-nav-bar">

      <!-- Bottom Hader Left -->
      <ul class="bottom-navbar-left">
        <li class="nav-items">
          <button class="nav-btn bottom-nav-btn">
            <img src="../assets/menu.svg" alt="Menu">
          </button>
        </li>
        <li class="nav-items">
          <button class="nav-btn bottom-nav-btn" *ngFor="let item of menuItems">{{item}}</button>
        </li>
      </ul>

      <!-- Bottom Hader Right -->
      <ul class="bottom-navbar-right">
        <li class="nav-items">
          <form class="nav-search-form">
            <input type="search" class="search-input" value placeholder="Поиск, например Круг зачистной">
          </form>
        </li>
        <li class="nav-items">
          <button class="nav-btn bottom-nav-btn btn-location">
            <img src="../assets/location.svg" alt="Location" class="location">
            <span>{{location}}</span>
          </button>
        </li>
      </ul>
    </nav>

  </div>
  


  <div class="header-banner">
    <div class="banner" *ngIf="isShowBanner"> 
      <img class="banner-img" src="../assets/main-banner.png" alt="">  
    </div>
    <button (click)="isShowBanner = !isShowBanner" style="border: 2px solid silver;">
    {{text}}
    </button>
  </div>

   
</header>

<section class="section section-one">
  <div class="wraper-section-one">
    <div class="info-block">
      <img src="../assets/buildBlock.svg" alt="">
      <div class="section-one-item">
       <span>Большой ассортимент</span>
       строительных материалов всегда в наличии
      </div>
    </div>
    <div class="info-block">
      <img src="../assets/delivery.svg" alt="">
      <div class="section-one-item">
        <span>Доставка стройматериалов</span>
        в течении четырех часов или в любое удобное время
      </div>
    </div>
    <div class="info-block">
      <img src="../assets/like.svg" alt="">
      <div class="section-one-item">
        <span>Многоуровневая система</span>
        управления качеством по стандарту ISO 9001
      </div>
    </div>
  </div>
</section>




 



<section>
  <div class="pages">
    <button 
      *ngFor="let item of newPages" 
      class="button-page-list active-button">{{item}}</button>
  </div>
</section>
